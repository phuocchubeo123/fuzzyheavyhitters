[dev-dependencies]
rayon = "1.3.1"
[package]
name = "mosaic"
version = "0.1.0"
edition = "2018"

[dependencies]
lazy_static = "1.5.0"
num-bigint = { version = "0.4.6", features = ["rand", "serde"] }
rand = "0.10.1"
rand_core = "0.10.1"
clap = "4.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
aes = "0.9.1"
rayon = "1.3.1"
csv = "1.4.0"
fancy-garbling = { git = "https://github.com/GaloisInc/swanky", rev="553ede0"}
ocelot = { git = "https://github.com/GaloisInc/swanky", rev="553ede0"}
scuttlebutt = { git = "https://github.com/GaloisInc/swanky", rev="553ede0"}
blake3 = "1.8.5"
indicatif = "0.18.0"
anyhow = "1"
sysinfo = "0.39.3"
uint = "0.10.0"

# Benchmarking components of the Mosaic system
[[bin]]
name = "batch_equality_fss_benchmark"
path = "src/bin/mosaic_components/batch_equality_fss_benchmark.rs"

[[bin]]
name = "batch_equality_gc_benchmark"
path = "src/bin/mosaic_components/batch_equality_gc_benchmark.rs"

